<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="styles.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
    <title>Calculadora básica</title>
</head>

<body> //Se usa la propiedad form para agrupar los elementos de la calculadora 
    <form>
        <h1>Calculadora básica</h1>
        <div class="contenedor">
            <input type="text" id="display" value="0" readonly> //Pantalla de la calculadora
            //Se crean clases para los botones de números, operaciones y especiales
            <input type="button" id="num7" value="7" class="btn-num">
            <input type="button" id="num8" value="8" class="btn-num">
            <input type="button" id="num9" value="9" class="btn-num">
            <input type="button" id="divide" value="/" class="btn-op">
            <input type="button" id="num4" value="4" class="btn-num">
            <input type="button" id="num5" value="5" class="btn-num">
            <input type="button" id="num6" value="6" class="btn-num">
            <input type="button" id="rest" value="-" class="btn-op">
            <input type="button" id="num1" value="1" class="btn-num">
            <input type="button" id="num2" value="2" class="btn-num">
            <input type="button" id="num3" value="3" class="btn-num">
            <input type="button" id="sum" value="+" class="btn-op">
            <input type="button" id="mult" value="*" class="btn-op">
            <input type="button" id="num0" value="0" class="btn-num">
            <input type="button" id="igual" value="=" class="btn-esp">
            <input type="button" id="limpiar" value="C" class="btn-esp">
            <input type="button" id="porcentaje" value="%" class="btn-op">
            <input type="button" id="punto" value="." class="btn-esp">
            <input type="button" id="borrar" value="←" class="btn-esp">
            <input type="button" id="raiz" value="√" class="btn-op">
        </div>
    </form>
    //Union con script.js para que funcione la calculadora
    <script src="script.js"></script>
</body>

</html>
